<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050807">
<title>GG RUSH</title>
<link rel="preload" as="image" href="assets/zhygul.webp" fetchpriority="high">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div><div id="particles"></div></div>
<main>
<header class="hud">
 <div class="user"><div class="avatar">GG</div><div><b>GG RUSH</b><small>GARAGE • LVL <span id="level">1</span></small></div></div>
 <div class="chips"><span>⚡ <b id="energy">10</b></span><span>💎 <b id="gems">0</b></span><button id="more">•••</button></div>
</header>
<section class="balance panel"><div><small>YOUR GG BALANCE</small><div class="money"><strong id="gg">0.00</strong><b>GG</b></div><span class="rate">+0.01 GG / tap</span></div><div class="coin">GG</div></section>

<section class="hero" id="tap">
 <div class="status-pill"><i></i> ЖИГУЛЬ • ACTIVE</div>
 <div class="hero-glow"></div>
 <picture class="car"><source media="(max-width:520px)" srcset="assets/zhygul-small.webp"><img src="assets/zhygul.webp" alt="Жигуль" decoding="async"></picture>
 <div class="tap-ring"></div><div class="tap-label">TAP TO EARN</div><div id="floats"></div>
</section>

<section class="fuel panel"><div class="fuel-top"><span>⛽ ПАЛИВО</span><b id="fuelText">100%</b></div><div class="fuel-line"><i id="fuelBar"></i></div><small id="fuelNote">Готова до роботи</small></section>
<section class="cards">
 <button class="card panel" data-open="quests"><span>🎯</span><b>Квести</b><small>Забери нагороди</small></button>
 <button class="card panel" data-open="slots"><span>🎰</span><b>Слоти</b><small>1 / 3 відкрито</small></button>
 <button class="card panel" data-open="top"><span>🏆</span><b>Топ</b><small>Лідери GG</small></button>
</section>
<nav class="nav panel">
 <button class="active" data-open="garage"><span>🚗</span><b>Гараж</b></button>
 <button data-open="slots"><span>🎰</span><b>Слоти</b></button>
 <button data-open="quests"><span>🎯</span><b>Квести</b><em></em></button>
 <button data-open="top"><span>🏆</span><b>Топ</b></button>
 <button data-open="profile"><span>👤</span><b>Профіль</b></button>
</nav>
</main>
<div class="modal off" id="modal"><div class="sheet panel"><button id="close">×</button><h2 id="title"></h2><div id="body"></div></div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js" defer></script>
</body>
</html>
