<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050706">
<title>GG RUSH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient"><i></i><i></i><i></i><i></i></div>
<main id="app">
<header class="topbar glass">
  <div class="profile"><div class="avatar">GG</div><div><b>GG RUSH</b><small>Гараж • Рівень <span id="level">1</span></small></div></div>
  <div class="resources"><span>⚡ <b id="energy">10</b></span><span>💎 <b id="gems">0</b></span><button id="menuBtn" class="icon-btn">☰</button></div>
</header>

<section class="balance glass">
  <div><small>ТВІЙ БАЛАНС</small><div class="balance-row"><strong id="gg">0.00</strong><span>GG</span></div><small class="gain">+<span id="perTap">0.01</span> GG / тап</small></div>
  <div class="gg-orb">GG</div>
</section>

<section class="car-stage" id="tapArea">
  <div class="scanline"></div><div class="ring"></div>
  <div class="car-wrap" id="car"><img src="assets/car-ui.png" alt="Жигуль"></div>
  <div class="tap-hint"><span class="pulse-dot"></span> ТАПАЙ НА ЖИГУЛЯ</div>
  <div id="floatLayer"></div><div id="sparkLayer"></div>
</section>

<section class="status-grid">
  <article class="stat glass"><small>ТАПИ</small><b id="taps">0</b><span>👆</span></article>
  <article class="stat glass"><small>ПАЛИВО</small><b id="fuel">100%</b><span>⛽</span></article>
  <article class="stat glass"><small>СЕРІЯ</small><b id="streak">0</b><span>🔥</span></article>
</section>

<section class="fuel-card glass">
  <div class="fuel-head"><span>⛽ Жигуль • COMMON</span><b id="fuelText">100%</b></div>
  <div class="bar"><i id="fuelBar"></i></div><small id="fuelNote">Машина готова до роботи</small>
</section>

<section class="quick-grid">
<button class="quick glass" data-tab="quests"><span>🎯</span><b>Квести</b><small>3 доступні</small></button>
<button class="quick glass" data-tab="slots"><span>🎰</span><b>Слоти</b><small>1 / 3 відкрито</small></button>
<button class="quick glass" data-tab="top"><span>🏆</span><b>Топ</b><small>#—</small></button>
</section>

<nav class="bottom-nav glass">
<button class="active" data-tab="garage"><span>🚗</span><b>Гараж</b></button>
<button data-tab="slots"><span>🎰</span><b>Слоти</b></button>
<button data-tab="quests"><span>🎯</span><b>Квести</b><em></em></button>
<button data-tab="top"><span>🏆</span><b>Топ</b></button>
<button data-tab="profile"><span>👤</span><b>Профіль</b></button>
</nav>
</main>

<div class="modal hidden" id="modal"><div class="modal-card glass"><button class="close" id="closeModal">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>
</html>
