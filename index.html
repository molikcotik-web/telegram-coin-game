<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>COIN RUSH ULTRA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 0,#33256b,#0b0d1d 65%);min-height:100vh}.loading{position:fixed;inset:0;background:#0b0d1d;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center}.loading.hide{display:none}.loadercoin{font-size:80px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loadbar{width:75%;max-width:360px;height:10px;background:#24213b;border-radius:20px;overflow:hidden}.loadbar i{display:block;width:0;height:100%;background:#8d70ff;transition:width .2s}.app{max-width:620px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font-size:24px;margin:8px 0}.lang,.btn,.tab{border:0;border-radius:12px;background:#272242;color:#fff;padding:10px;font-weight:800}.hero{background:linear-gradient(135deg,#241c48,#17142d);border:1px solid #4b3e7d;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 15px 40px #0005}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#201b39;border-radius:14px;padding:9px}.stat small{color:#aaa}.stat b{display:block;font-size:19px;margin-top:3px}.xp{height:8px;background:#100e20;border-radius:9px;margin-top:10px;overflow:hidden}.xp i{display:block;height:100%;width:0;background:#8d70ff}.coin{display:block;width:210px;height:210px;margin:18px auto;border:0;border-radius:50%;font-size:82px;cursor:pointer;background:radial-gradient(circle at 30% 22%,#fffde0,#ffe44d 35%,#ffb000 68%,#9a5000);box-shadow:0 18px 45px #0009,inset 0 -13px 20px #8a4d00;touch-action:manipulation}.coin:active{transform:scale(.9)}.combo{text-align:center;height:24px;color:#ffe05a;font-weight:900}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.tab{font-size:12px}.tab.active{background:#7358ff}.panel{background:#1b1732;border:1px solid #403568;border-radius:18px;padding:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #332b52}.row:last-child{border:0}.row small{display:block;color:#999;margin-top:4px}.buy{background:#7358ff;color:#fff;border:0;border-radius:10px;padding:10px;font-weight:800}.buy:disabled{opacity:.3}.center{text-align:center}.ref{background:#271f48;border:1px dashed #7358ff;padding:12px;border-radius:14px;word-break:break-all}.code{font-size:18px;color:#ffe15c;font-weight:900}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:#151326;padding:11px 16px;border-radius:12px;font-weight:800;display:none;z-index:30}.toast.show{display:block}.reset{display:block;margin:12px auto;background:none;border:0;color:#666;font-size:11px}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="loadercoin">🪙</div><h2>COIN RUSH ULTRA</h2><div class="loadbar"><i id="load"></i></div><p id="loadText">Завантаження...</p></div>
<div class="toast" id="toast"></div>
<div class="app">
<div class="top"><h1>🪙 COIN RUSH ULTRA</h1><select id="lang" class="lang"><option value="uk">🇺🇦 UA</option><option value="en">🇬🇧 EN</option><option value="pl">🇵🇱 PL</option></select></div>
<div class="hero">
<div class="stats"><div class="stat"><small id="lc"></small><b id="coins">0</b></div><div class="stat"><small id="lp"></small><b id="power">1</b></div><div class="stat"><small id="ll"></small><b id="level">1</b></div></div>
<div class="xp"><i id="xp"></i></div>
</div>
<button id="coin" class="coin">🪙</button><div id="combo" class="combo"></div>
<div class="tabs"><button class="tab active" data-page="shop" id="shop"></button><button class="tab" data-page="quests" id="quests"></button><button class="tab" data-page="ref" id="refs"></button><button class="tab" data-page="daily" id="daily"></button><button class="tab" data-page="more" id="more"></button></div>
<div id="panel" class="panel"></div>
<button id="reset" class="reset"></button>
</div>
<script>
(()=> {
const T={
uk:{coins:"Монети",power:"За клік",level:"Рівень",shop:"🛒 Магазин",quests:"🎯 Квести",ref:"👥 Реферали",daily:"🎁 Бонус",more:"✨ Ще",powerUp:"⚡ Сила +1",powerDesc:"Більше монет за клік",auto:"🤖 Автоклікер",autoDesc:"Монети кожні 2 секунди",dbl:"💎 x2",dblDesc:"Подвійний дохід з кліку",buy:"КУПИТИ",bought:"КУПЛЕНО",claim:"ЗАБРАТИ",done:"ГОТОВО",process:"В ПРОЦЕСІ",dailyTitle:"Щоденний бонус",dailyDesc:"Заходь щодня та отримуй все більше монет!",get:"ОТРИМАТИ",wait:"ВЖЕ ОТРИМАНО",refTitle:"Реферальна програма",refDesc:"Запроси друзів. За кожного друга — 1 000 🪙.",copy:"КОПІЮВАТИ КОД",share:"ПОДІЛИТИСЯ",invited:"Запрошено",earned:"З рефералів",yourCode:"Твій код",bonus:"Бонус за запрошення",ach:"Досягнення",skin:"Скін монети",theme:"Тема",reset:"Скинути прогрес",confirm:"Скинути весь прогрес?",combo:"🔥 КОМБО x",clicks:"Кліків",total:"Всього зароблено",autoN:"Автоклікерів",yes:"Так",no:"Ні",qs:[["c100","👆 100 кліків",100,100],["m1000","🪙 1 000 монет",1000,250],["l5","⭐ Рівень 5",5,500],["c1000","👆 1 000 кліків",1000,1000]]},
en:{coins:"Coins",power:"Per click",level:"Level",shop:"🛒 Shop",quests:"🎯 Quests",ref:"👥 Referrals",daily:"🎁 Daily",more:"✨ More",powerUp:"⚡ Power +1",powerDesc:"More coins per click",auto:"🤖 Auto clicker",autoDesc:"Coins every 2 seconds",dbl:"💎 x2",dblDesc:"Double click income",buy:"BUY",bought:"BOUGHT",claim:"CLAIM",done:"DONE",process:"IN PROGRESS",dailyTitle:"Daily bonus",dailyDesc:"Come back every day for bigger rewards!",get:"GET",wait:"ALREADY CLAIMED",refTitle:"Referral program",refDesc:"Invite friends. Get 1,000 🪙 for each friend.",copy:"COPY CODE",share:"SHARE",invited:"Invited",earned:"From referrals",yourCode:"Your code",bonus:"Invite bonus",ach:"Achievements",skin:"Coin skin",theme:"Theme",reset:"Reset progress",confirm:"Reset all progress?",combo:"🔥 COMBO x",clicks:"Clicks",total:"Total earned",autoN:"Auto clickers",yes:"Yes",no:"No",qs:[["c100","👆 100 clicks",100,100],["m1000","🪙 1,000 coins",1000,250],["l5","⭐ Level 5",5,500],["c1000","👆 1,000 clicks",1000,1000]]},
pl:{coins:"Monety",power:"Za klik",level:"Poziom",shop:"🛒 Sklep",quests:"🎯 Zadania",ref:"👥 Polecenia",daily:"🎁 Bonus",more:"✨ Więcej",powerUp:"⚡ Moc +1",powerDesc:"Więcej monet za klik",auto:"🤖 Auto klikacz",autoDesc:"Monety co 2 sekundy",dbl:"💎 x2",dblDesc:"Podwójny dochód",buy:"KUP",bought:"KUPIONE",claim:"ODBIERZ",done:"GOTOWE",process:"W TOKU",dailyTitle:"Dzienny bonus",dailyDesc:"Wracaj codziennie po większą nagrodę!",get:"ODBIERZ",wait:"JUŻ ODEBRANO",refTitle:"Program poleceń",refDesc:"Zaproś znajomych. Dostajesz 1 000 🪙 za osobę.",copy:"KOPIUJ KOD",share:"UDOSTĘPNIJ",invited:"Zaproszeni",earned:"Z poleceń",yourCode:"Twój kod",bonus:"Bonus za zaproszenie",ach:"Osiągnięcia",skin:"Skórka monety",theme:"Motyw",reset:"Resetuj postęp",confirm:"Zresetować cały postęp?",combo:"🔥 KOMBO x",clicks:"Kliknięcia",total:"Łącznie zarobiono",autoN:"Auto klikacze",yes:"Tak",no:"Nie",qs:[["c100","👆 100 kliknięć",100,100],["m1000","🪙 1 000 monet",1000,250],["l5","⭐ Poziom 5",5,500],["c1000","👆 1 000 kliknięć",1000,1000]]}
};
let S={};try{S=JSON.parse(localStorage.CR_ULTRA||"{}")}catch(e){}
let coins=S.coins||0,power=S.power||1,clicks=S.clicks||0,auto=S.auto||0,dbl=!!S.dbl,total=S.total||0,best=S.best||0,pCost=S.pCost||25,aCost=S.aCost||150,claimed=S.claimed||{},referrals=S.referrals||0,refEarn=S.refEarn||0,day=S.day||"",streak=S.streak||0,skin=S.skin||0,lang=localStorage.CR_LANG||"uk",page="shop",combo=0,timer;
const $=id=>document.getElementById(id), tr=()=>T[lang], lvl=()=>Math.floor(clicks/100)+1, fmt=x=>Math.floor(x).toLocaleString();
function save(){localStorage.CR_ULTRA=JSON.stringify({coins,power,clicks,auto,dbl,total,best,pCost,aCost,claimed,referrals,refEarn,day,streak,skin})}
function code(){let n=0;try{n=Telegram?.WebApp?.initDataUnsafe?.user?.id||0}catch(e){}return "CR"+String(n||"728391").slice(-6)}
function top(){let x=tr();$("coins").textContent=fmt(coins);$("power").textContent=fmt(power);$("level").textContent=lvl();$("xp").style.width=(clicks%100)+"%";$("lc").textContent=x.coins;$("lp").textContent=x.power;$("ll").textContent=x.level;$("shop").textContent=x.shop;$("quests").textContent=x.quests;$("refs").textContent=x.ref;$("daily").textContent=x.daily;$("more").textContent=x.more;$("reset").textContent=x.reset}
function shop(){let x=tr();$("panel").innerHTML=`<div class=row><div><b>${x.powerUp}</b><small>${x.powerDesc}</small></div><button class=buy id=bp ${coins<pCost?"disabled":""}>${fmt(pCost)} 🪙</button></div><div class=row><div><b>${x.auto}</b><small>${x.autoDesc}</small></div><button class=buy id=ba ${coins<aCost?"disabled":""}>${fmt(aCost)} 🪙</button></div><div class=row><div><b>${x.dbl}</b><small>${x.dblDesc}</small></div><button class=buy id=bd ${dbl?"disabled":""}>${dbl?x.bought:"500 🪙"}</button></div>`;$("bp").onclick=()=>{if(coins>=pCost){coins-=pCost;power++;pCost=Math.ceil(pCost*1.65);save();refresh()}};$("ba").onclick=()=>{if(coins>=aCost){coins-=aCost;auto++;aCost=Math.ceil(aCost*1.7);save();refresh()}};$("bd").onclick=()=>{if(!dbl&&coins>=500){coins-=500;dbl=true;save();refresh()}}}
function quests(){let x=tr(),o="";for(let q of x.qs){let v=q[0][0]=="m"?coins:q[0][0]=="l"?lvl():clicks,ok=v>=q[2],done=claimed[q[0]];o+=`<div class=row><div><b>${q[1]}</b><small>${Math.min(v,q[2])}/${q[2]} • +${q[3]} 🪙</small></div><button class=buy data-q=${q[0]} ${!ok||done?"disabled":""}>${done?x.done:ok?x.claim:x.process}</button></div>`}$("panel").innerHTML=o;document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{let q=x.qs.find(q=>q[0]==b.dataset.q);claimed[q[0]]=1;coins+=q[3];save();refresh()})}
function refs(){let x=tr(),c=code();$("panel").innerHTML=`<div class=center><h2>${x.refTitle}</h2><p>${x.refDesc}</p><div class=ref><small>${x.yourCode}</small><div class=code>${c}</div></div><br><button class=buy id=copy>${x.copy}</button> <button class=buy id=share>${x.share}</button><div class=row><span>${x.invited}</span><b>${referrals}</b></div><div class=row><span>${x.earned}</span><b>${fmt(refEarn)} 🪙</b></div></div>`;$("copy").onclick=async()=>{try{await navigator.clipboard.writeText(c);toast("✅ "+x.copy)}catch(e){toast(c)}};$("share").onclick=()=>{let u=location.href.split("?")[0]+"?ref="+c;if(navigator.share)navigator.share({title:"COIN RUSH ULTRA",text:"Join my game!",url:u});else{navigator.clipboard?.writeText(u);toast("🔗 "+u)}}}
function daily(){let x=tr(),today=new Date().toDateString(),ready=day!==today,reward=100+streak*50;$("panel").innerHTML=`<div class=center><div style="font-size:60px">🎁</div><h2>${x.dailyTitle}</h2><p>${x.dailyDesc}</p><h2>+${fmt(reward)} 🪙</h2><button class=buy id=get ${ready?"":"disabled"}>${ready?x.get:x.wait}</button><p>🔥 ${streak} day streak</p></div>`;$("get").onclick=()=>{if(day===today)return;day=today;streak++;coins+=reward;save();refresh();toast("🎁 +"+reward+" 🪙")}}
function more(){let x=tr();$("panel").innerHTML=`<div class=center><h2>${x.ach}</h2><p>🪙 ${clicks>=1000?"🏆":"🔒"} 1,000 ${x.clicks}</p><p>⭐ ${lvl()>=10?"🏆":"🔒"} Level 10</p><p>💰 ${coins>=10000?"🏆":"🔒"} 10,000 coins</p><hr><h3>${x.skin}</h3><button class=buy id=skin>${skin%2?"🌟 GOLD":"🪙 CLASSIC"}</button><p>${x.theme}: Ultra</p></div>`;$("skin").onclick=()=>{skin++;document.body.style.filter=skin%2?"saturate(1.3)":"none";save();refresh()}}
function stats(){let x=tr();$("panel").innerHTML=`<div class=center><h2>📊 ${x.more}</h2><p>${x.clicks}: <b>${fmt(clicks)}</b></p><p>${x.total}: <b>${fmt(total)}</b></p><p>🏆 ${x.coins}: <b>${fmt(best)}</b></p><p>${x.autoN}: <b>${auto}</b></p></div>`}
function refresh(){top();if(page=="shop")shop();else if(page=="quests")quests();else if(page=="ref")refs();else if(page=="daily")daily();else more()}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1600)}
$("coin").onclick=()=>{let g=power*(dbl?2:1);coins+=g;clicks++;total+=g;best=Math.max(best,coins);combo++;$("combo").textContent=combo>2?tr().combo+combo+"!":"";clearTimeout(timer);timer=setTimeout(()=>{$("combo").textContent="";combo=0},1200);save();refresh()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll(".tab").forEach(q=>q.classList.remove("active"));b.classList.add("active");refresh()});
$("lang").value=lang;$("lang").onchange=function(){lang=this.value;localStorage.CR_LANG=lang;refresh()}
$("reset").onclick=()=>{if(confirm(tr().confirm)){localStorage.removeItem("CR_ULTRA");location.reload()}}
setInterval(()=>{if(auto){coins+=auto;total+=auto;best=Math.max(best,coins);save();top()}},2000);
let p=0,li=setInterval(()=>{p+=10;$("load").style.width=p+"%";if(p>=100){clearInterval(li);setTimeout(()=>$("loading").classList.add("hide"),250)}},100);
refresh();
})();
</script>
</body>
</html>
