<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COIN RUSH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#11152b,#30205d);color:#fff;font-family:Arial;text-align:center}.app{max-width:540px;margin:auto;padding:18px}h1{margin:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card,.panel{background:#211d3d;border:1px solid #443b70;border-radius:15px;padding:12px}.num{font-size:22px;font-weight:bold}.label{font-size:12px;color:#aaa}.coin{width:190px;height:190px;border:0;border-radius:50%;margin:25px auto;background:radial-gradient(circle at 35% 30%,#fff7a8,#ffd52e 42%,#d88d00 80%);font-size:78px;cursor:pointer;display:block;box-shadow:0 15px 35px #0007}.coin:active{transform:scale(.92)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.tab,.buy{border:0;border-radius:11px;padding:10px;background:#715cff;color:white;font-weight:bold}.tab{background:#29244a}.active{background:#715cff}.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #39315d;text-align:left}.item small{display:block;color:#999;margin-top:4px}.buy:disabled{opacity:.4}.combo{height:28px;color:#ffe05c;font-weight:bold}.bar{height:9px;background:#17132d;border-radius:9px;margin:5px 0 15px;overflow:hidden}.fill{height:100%;background:#8b70ff;width:0}.reset{background:none;border:0;color:#777;margin-top:12px}
</style></head><body><div class="app"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1 id="title">🪙 COIN RUSH</h1><select id="lang" style="background:#29244a;color:white;border:1px solid #443b70;border-radius:10px;padding:8px"><option value="uk">🇺🇦 Українська</option><option value="en">🇬🇧 English</option><option value="pl">🇵🇱 Polski</option></select></div><p id="subtitle">Збирай монети та прокачуй свій акаунт!</p>
<div class="stats"><div class="card"><span class="label">Монети</span><div class="num" id="coins">0</div></div><div class="card"><span class="label">За клік</span><div class="num" id="power">1</div></div><div class="card"><span class="label">Рівень</span><div class="num" id="level">1</div></div></div>
<button class="coin" id="coin">🪙</button><div class="combo" id="combo"></div><div class="bar"><div class="fill" id="fill"></div></div>
<div class="tabs"><button class="tab active" data-t="shop">🛒 Магазин</button><button class="tab" data-t="quest">🎯 Завдання</button><button class="tab" data-t="profile">👤 Профіль</button></div>
<div class="panel" id="panel"></div><button class="reset" id="reset">Скинути прогрес</button></div>
<script>

const T={
uk:{subtitle:"Збирай монети та прокачуй свій акаунт!",coins:"Монети",power:"За клік",level:"Рівень",shop:"🛒 Магазин",quest:"🎯 Завдання",profile:"👤 Профіль",powerUp:"⚡ Сила +1",powerDesc:"Більше монет за клік",auto:"🤖 Автоклікер",autoDesc:"Монети кожні 2 секунди",double:"💎 Подвійний клік",doubleDesc:"×2 до доходу з кліку",bought:"КУПЛЕНО",process:"В ПРОЦЕСІ",take:"ЗАБРАТИ",done:"ГОТОВО",reward:"нагорода",profileTitle:"👤 Профіль",clicks:"Кліків",bots:"Автоклікерів",doubleStatus:"Подвійний клік",yes:"Так",no:"Ні",reset:"Скинути прогрес",combo:"🔥 КОМБО x",confirm:"Скинути прогрес?",quests:[["clicks","👆 100 кліків",100,100],["coins","🪙 1 000 монет",1000,250],["level","⭐ Рівень 5",5,500]]},
en:{subtitle:"Collect coins and upgrade your account!",coins:"Coins",power:"Per click",level:"Level",shop:"🛒 Shop",quest:"🎯 Quests",profile:"👤 Profile",powerUp:"⚡ Power +1",powerDesc:"More coins per click",auto:"🤖 Auto clicker",autoDesc:"Coins every 2 seconds",double:"💎 Double click",doubleDesc:"×2 click income",bought:"BOUGHT",process:"IN PROGRESS",take:"CLAIM",done:"DONE",reward:"reward",profileTitle:"👤 Profile",clicks:"Clicks",bots:"Auto clickers",doubleStatus:"Double click",yes:"Yes",no:"No",reset:"Reset progress",combo:"🔥 COMBO x",confirm:"Reset progress?",quests:[["clicks","👆 100 clicks",100,100],["coins","🪙 1,000 coins",1000,250],["level","⭐ Level 5",5,500]]},
pl:{subtitle:"Zbieraj monety i rozwijaj swoje konto!",coins:"Monety",power:"Za kliknięcie",level:"Poziom",shop:"🛒 Sklep",quest:"🎯 Zadania",profile:"👤 Profil",powerUp:"⚡ Moc +1",powerDesc:"Więcej monet za kliknięcie",auto:"🤖 Auto klikacz",autoDesc:"Monety co 2 sekundy",double:"💎 Podwójne kliknięcie",doubleDesc:"×2 za kliknięcie",bought:"KUPIONE",process:"W TOKU",take:"ODBIERZ",done:"GOTOWE",reward:"nagroda",profileTitle:"👤 Profil",clicks:"Kliknięcia",bots:"Auto klikacze",doubleStatus:"Podwójne kliknięcie",yes:"Tak",no:"Nie",reset:"Resetuj postęp",combo:"🔥 KOMBO x",confirm:"Zresetować postęp?",quests:[["clicks","👆 100 kliknięć",100,100],["coins","🪙 1 000 monet",1000,250],["level","⭐ Poziom 5",5,500]]}
};
let lang=localStorage.coinLang||"uk";
function tr(){return T[lang]}
function applyLang(){
 const t=tr();
 document.getElementById("subtitle").textContent=t.subtitle;
 document.querySelector(".stats .card:nth-child(1) .label").textContent=t.coins;
 document.querySelector(".stats .card:nth-child(2) .label").textContent=t.power;
 document.querySelector(".stats .card:nth-child(3) .label").textContent=t.level;
 document.querySelector('[data-t="shop"]').textContent=t.shop;
 document.querySelector('[data-t="quest"]').textContent=t.quest;
 document.querySelector('[data-t="profile"]').textContent=t.profile;
 document.getElementById("reset").textContent=t.reset;
 refresh();
}
document.getElementById("lang").value=lang;
document.getElementById("lang").onchange=e=>{lang=e.target.value;localStorage.coinLang=lang;applyLang()};

let s=JSON.parse(localStorage.coinRush||"{}"),coins=s.coins||0,power=s.power||1,clicks=s.clicks||0,auto=s.auto||0,double=s.double||false,done=s.done||{},cost= s.cost||25,autoCost=s.autoCost||150,combo=0;
const qs=[["clicks","👆 100 кліків",100,100],["coins","🪙 1 000 монет",1000,250],["level","⭐ Рівень 5",5,500]];
function save(){localStorage.coinRush=JSON.stringify({coins,power,clicks,auto,double,done,cost,autoCost})}
function level(){return Math.floor(clicks/100)+1} function f(n){return Math.floor(n).toLocaleString("uk-UA")}
function render(){coinsEl.textContent=f(coins);powerEl.textContent=f(power);levelEl.textContent=level();fill.style.width=(clicks%100)+"%"}
function shop(){let t=tr();panel.innerHTML=`<div class=item><div><b>${t.powerUp}</b><small>${t.powerDesc}</small></div><button class=buy id=p ${coins<cost?"disabled":""}>${f(cost)} 🪙</button></div><div class=item><div><b>${t.auto}</b><small>${t.autoDesc}</small></div><button class=buy id=a ${coins<autoCost?"disabled":""}>${f(autoCost)} 🪙</button></div><div class=item><div><b>${t.double}</b><small>${t.doubleDesc}</small></div><button class=buy id=d ${double?"disabled":""}>${double?t.bought:"500 🪙"}</button></div>`;p.onclick=()=>{coins-=cost;power++;cost=Math.ceil(cost*1.7);save();refresh()};a.onclick=()=>{coins-=autoCost;auto++;autoCost=Math.ceil(autoCost*1.8);save();refresh()};d.onclick=()=>{coins-=500;double=true;save();refresh()}}
function quest(){let t=tr();panel.innerHTML=t.quests.map(q=>{let v=q[0]=="clicks"?clicks:q[0]=="coins"?coins:level(),ok=v>=q[2];return `<div class=item><div><b>${q[1]}</b><small>${Math.min(v,q[2])}/${q[2]} • ${t.reward} ${q[3]} 🪙</small></div><button class=buy data-q=${q[0]} ${!ok||done[q[0]]?"disabled":""}>${done[q[0]]?t.done:ok?t.take:t.process}</button></div>`}).join("");document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{let q=t.quests.find(x=>x[0]==b.dataset.q);done[q[0]]=1;coins+=q[3];save();refresh()})}
function profile(){let t=tr();panel.innerHTML=`<h2>${t.profileTitle}</h2><p>${t.level}: <b>${level()}</b></p><p>${t.clicks}: <b>${f(clicks)}</b></p><p>${t.bots}: <b>${auto}</b></p><p>${t.doubleStatus}: <b>${double?t.yes:t.no}</b></p>`}
function refresh(){render();if(window.tab=="quest")quest();else if(window.tab=="profile")profile();else shop()}
document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>{document.querySelectorAll(".tab").forEach(y=>y.classList.remove("active"));x.classList.add("active");window.tab=x.dataset.t;refresh()});
coin.onclick=()=>{let gain=power*(double?2:1);coins+=gain;clicks++;combo++;comboEl.textContent=combo>2?tr().combo+combo+"!":"";
clearTimeout(window.ct);window.ct=setTimeout(()=>{combo=0;comboEl.textContent=""},1200);save();refresh()};
setInterval(()=>{if(auto){coins+=auto;save();refresh()}},2000);
reset.onclick=()=>{if(confirm("Скинути прогрес?")){localStorage.removeItem("coinRush");location.reload()}}
const coinsEl=document.getElementById("coins"),powerEl=document.getElementById("power"),levelEl=document.getElementById("level"),fill=document.getElementById("fill"),panel=document.getElementById("panel"),coin=document.getElementById("coin"),comboEl=document.getElementById("combo"),reset=document.getElementById("reset");window.tab="shop";applyLang();
</script></body></html>
