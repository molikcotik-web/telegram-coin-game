<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GG RUSH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050711;color:#fff;font-family:Inter,system-ui,Arial;min-height:100vh;background:radial-gradient(circle at 50% -5%,#263d73,#0b1020 34%,#050711 75%)}button{font:inherit}.app{max-width:540px;margin:auto;padding:17px 15px 105px}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:1000;letter-spacing:2px}.logo i{color:#9cff4d;font-style:normal}.status{font-size:10px;color:#aaff70;background:#0b1716;border:1px solid #2d4e37;padding:8px 10px;border-radius:99px}.panel{display:none}.panel.on{display:block}.card{margin-top:14px;border:1px solid #263451;border-radius:25px;background:linear-gradient(145deg,#111a2df0,#080d17f0);box-shadow:0 18px 60px #0009}.balance{text-align:center;padding:21px;overflow:hidden}.label{font-size:10px;letter-spacing:2px;color:#8797b5}.amount{font-size:49px;font-weight:1000;margin:4px;text-shadow:0 0 30px #9cff4d55}.amount span{font-size:16px;color:#aaff70}.bar{height:7px;background:#202a41;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#9cff4d;width:0;transition:.25s}.lv{display:flex;justify-content:space-between;color:#8291ac;font-size:10px;margin-top:7px}.tapcard{text-align:center;padding:24px}.coin{width:238px;height:238px;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 32% 25%,#ecffc9,#aaff62 22%,#69db27 56%,#32910d);box-shadow:inset 0 -22px 28px #22750a66,0 0 0 10px #9cff4d0c,0 0 75px #9cff4d40;color:#fff;font-size:70px;font-weight:1000;text-shadow:0 4px 15px #276000;transition:.07s}.coin:active{transform:scale(.91)}.hint{color:#7787a4;font-size:11px;margin-top:13px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:12px}.stat{background:#09101d;border:1px solid #1e2a42;border-radius:17px;padding:13px}.stat b{display:block;font-size:20px}.stat small{font-size:9px;color:#7585a2}.section{padding:16px}.title{font-weight:950;display:flex;justify-content:space-between}.title small{font-size:9px;color:#71819f;font-weight:500}.item{display:flex;align-items:center;gap:11px;background:#09101c;border:1px solid #22304a;border-radius:17px;padding:12px;margin-top:9px}.ico{width:42px;height:42px;border-radius:13px;background:#15233c;display:grid;place-items:center;font-size:20px}.item main{flex:1}.item p{margin:3px 0 0;color:#7383a1;font-size:10px}.btn{border:0;border-radius:11px;padding:9px 11px;background:#9cff4d;color:#061006;font-weight:950;cursor:pointer}.btn:disabled{opacity:.35}.case{text-align:center;padding:22px}.box{width:170px;height:135px;margin:15px auto;display:grid;place-items:center;border-radius:23px;background:linear-gradient(145deg,#2b4170,#111a31);border:1px solid #4b6595;font-size:58px;box-shadow:0 0 50px #5d8eff22}.box.open{animation:open .7s}.result{font-size:24px;font-weight:1000;min-height:32px}@keyframes open{50%{transform:scale(1.16) rotate(5deg);box-shadow:0 0 100px #9cff4d77}100%{transform:scale(1)}}.leader{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #1e2a40}.leader main{flex:1}.rank{width:30px;text-align:center;font-weight:1000}.pill{background:#16243d;color:#aaff70;border-radius:9px;padding:6px;font-size:10px}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#060a12ef;backdrop-filter:blur(18px);border-top:1px solid #202d45}.nav button{border:0;background:transparent;color:#7484a1;border-radius:14px;padding:8px 2px;font-size:10px}.nav button.on{background:#142139;color:#baff7d}.toast{position:fixed;z-index:50;top:20px;left:50%;transform:translate(-50%,-20px);opacity:0;background:#eaffd3;color:#071006;padding:10px 15px;border-radius:13px;font-weight:950;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}.float{position:fixed;z-index:40;pointer-events:none;color:#baff76;font-weight:1000;text-shadow:0 0 15px #9cff4d;animation:f .85s forwards}@keyframes f{to{opacity:0;transform:translateY(-100px) scale(1.35)}}.particle{position:fixed;z-index:39;width:7px;height:7px;border-radius:50%;background:#9cff4d;pointer-events:none;animation:p .6s forwards}@keyframes p{to{opacity:0;transform:translate(var(--x),var(--y)) scale(.1)}}.muted{color:#71819e;font-size:12px}
</style></head>
<body><div id="toast" class="toast"></div><div class="app">
<header class="head"><div class="logo">GG <i>RUSH</i></div><div id="status" class="status">● CONNECTING</div></header>
<section id="home" class="panel on">
<div class="card balance"><div class="label">БАЛАНС</div><div id="amount" class="amount">0.00 <span>GG</span></div><div class="bar"><i id="xp"></i></div><div class="lv"><span id="level">LEVEL 1</span><span id="prog">0 / 100</span></div></div>
<div class="card tapcard"><button id="coin" class="coin">GG</button><div class="hint">Тапай • Critical Tap • прокачуйся</div></div>
<div class="card stats"><div class="stat"><b id="taps">0</b><small>ТАПІВ</small></div><div class="stat"><b id="cases">0</b><small>КЕЙСІВ</small></div><div class="stat"><b id="refs">0</b><small>РЕФЕРАЛІВ</small></div><div class="stat"><b id="mult">x1.00</b><small>МНОЖНИК</small></div></div>
<div class="card section"><div class="title">⚡ АПГРЕЙДИ <small>складніше з кожним рівнем</small></div><div id="ups"></div></div>
</section>
<section id="quests" class="panel"><div class="card section"><div class="title">📜 КВЕСТИ</div>
<div class="item"><div class="ico">📢</div><main><b>Підписка на GG RUSH</b><p>Підпишись на @ggrushReady</p></main><button class="btn" id="sub">ВІДКРИТИ</button></div>
<div class="item"><div class="ico">👆</div><main><b>100 тапів</b><p id="q1">0 / 100</p></main><button class="btn" disabled>+1 GG</button></div>
<div class="item"><div class="ico">🎁</div><main><b>3 кейси</b><p id="q2">0 / 3</p></main><button class="btn" disabled>+2 GG</button></div>
</div></section>
<section id="cases" class="panel"><div class="card case"><div class="title">🎁 КЕЙС</div><div id="box" class="box">🎁</div><button id="caseBtn" class="btn" style="width:100%;padding:14px">ВІДКРИТИ • 1 GG</button><div id="result" class="result"></div></div></section>
<section id="top" class="panel"><div class="card section"><div class="title">🏆 ТОП ГРАВЦІВ</div><div id="leaders"><div class="muted">Завантаження...</div></div></div></section>
</div>
<nav class="nav"><button class="on" data-p="home">⚡<br>ГОЛОВНА</button><button data-p="quests">📜<br>КВЕСТИ</button><button data-p="cases">🎁<br>КЕЙС</button><button data-p="top">🏆<br>ТОП</button></nav>
<script>
const API="https://gg-rush-api.molikcotik.workers.dev",tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor?.("#050711");}
const user=tg?.initDataUnsafe?.user;if(!user){document.body.innerHTML='<div style="padding:30px;text-align:center;font-family:Arial;color:white;background:#050711;min-height:100vh"><h2>GG RUSH</h2><p>Відкрий гру через Telegram Mini App.</p></div>';throw new Error("Telegram WebApp required");}
const id=String(user.id),username=user.username||user.first_name||"Гравець";let s={gg:0,taps:0,cases:0,refs:0,up:{},sub:false};
const $=x=>document.getElementById(x);function toast(t){$("toast").textContent=t;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),1200)}
async function api(path,data){try{const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});return await r.json()}catch(e){return null}}
function render(){const l=Math.floor(s.taps/100)+1,p=s.taps%100,m=1+(s.up.multi||0)*.25;$("amount").innerHTML=s.gg.toFixed(2)+' <span>GG</span>';$("taps").textContent=s.taps;$("cases").textContent=s.cases;$("refs").textContent=s.refs;$("mult").textContent="x"+m.toFixed(2);$("level").textContent="LEVEL "+l;$("prog").textContent=p+" / 100";$("xp").style.width=p+"%";$("q1").textContent=Math.min(s.taps,100)+" / 100";$("q2").textContent=Math.min(s.cases,3)+" / 3";$("sub").textContent=s.sub?"✓ ГОТОВО":"ВІДКРИТИ";
const a=[["power","👆","СИЛА ТАПУ","+50% базової нагороди",.03],["multi","🔥","МНОЖНИК","+25% нагороди",.15],["crit","💎","CRITICAL","шанс x5",.25]];$("ups").innerHTML=a.map(u=>{let n=s.up[u[0]]||0,c=u[4]*2**n*(1+(l-1)*.4);return `<div class="item"><div class="ico">${u[1]}</div><main><b>${u[2]} · ${n}</b><p>${u[3]}</p></main><button class="btn" onclick="buy('${u[0]}',${c})">${c.toFixed(2)} GG</button></div>`}).join("")}
async function sync(){const r=await api("/player/heartbeat",{telegramId:id,username});if(r?.ok&&r.player){s.gg=Number(r.player.gg);s.taps=Number(r.player.taps);s.cases=Number(r.player.cases);s.refs=Number(r.player.referrals);render();$("status").textContent="● ONLINE"}else $("status").textContent="● OFFLINE"}
function fx(x,y,text){let f=document.createElement("i");f.className="float";f.textContent=text;f.style.left=x+"px";f.style.top=y+"px";document.body.append(f);for(let i=0;i<12;i++){let p=document.createElement("i");p.className="particle";p.style.left=x+"px";p.style.top=y+"px";p.style.setProperty("--x",(Math.random()*180-90)+"px");p.style.setProperty("--y",(Math.random()*160-100)+"px");document.body.append(p);setTimeout(()=>p.remove(),600)}setTimeout(()=>f.remove(),850)}
$("coin").onclick=async e=>{let r=await api("/player/tap",{telegramId:id,username});if(!r?.ok)return toast("❌ Сервер недоступний");s.gg=Number(r.gg);s.taps=Number(r.taps);render();fx(e.clientX,e.clientY,"+0.01 GG")};
window.buy=async(k,c)=>{if(s.gg<c)return toast("❌ Потрібно "+c.toFixed(2)+" GG");toast("⚡ Апгрейди будуть синхронізовані в наступній версії");};
$("sub").onclick=()=>{window.open("https://t.me/ggrushReady","_blank");s.sub=true;render();toast("📢 Відкрий канал і підпишись!")};
$("caseBtn").onclick=async()=>{const r=await api("/player/case",{telegramId:id});if(!r?.ok){toast(r?.error==="not_enough_gg"?"❌ Потрібно 1 GG":"❌ Помилка");return}s.gg=Number(r.gg);s.cases++;render();$("box").classList.remove("open");void $("box").offsetWidth;$("box").classList.add("open");$("result").textContent="🎉 +"+Number(r.reward).toFixed(2)+" GG"};
async function top(){try{const r=await fetch(API+"/top");const a=await r.json();$("leaders").innerHTML=(a||[]).map((p,i)=>`<div class="leader"><div class="rank">#${i+1}</div><main><b>${p.username||"Гравець"}</b><br><small style="color:#71819e">${p.taps||0} тапів</small></main><span class="pill">${Number(p.gg||0).toFixed(2)} GG</span></div>`).join("")||'<div class="muted">Поки порожньо.</div>'}catch(e){$("leaders").innerHTML='<div class="muted">API недоступний.</div>'}}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));$(b.dataset.p).classList.add("on");if(b.dataset.p==="top")top()});
render();sync();setInterval(sync,30000);
</script></body></html>
