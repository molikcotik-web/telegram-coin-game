<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GG RUSH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#24365f,#080b13 55%);color:#fff;font-family:Arial,sans-serif}.app{max-width:520px;margin:auto;padding:18px 15px 100px}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px;font-weight:900;letter-spacing:2px}.logo i{color:#8cff3e;font-style:normal}.status{font-size:11px;color:#8cff3e;background:#111a2c;border:1px solid #293956;border-radius:20px;padding:8px}.card{background:#10182aee;border:1px solid #293957;border-radius:22px;margin:14px 0;box-shadow:0 15px 45px #0006}.balance{text-align:center;padding:22px}.small{color:#8999b8;font-size:12px;letter-spacing:2px}.gg{font-size:48px;font-weight:900;margin:5px}.gg span{font-size:17px;color:#aaff72}.bar{height:8px;background:#202b43;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#8cff3e;width:0;transition:.3s}.lv{display:flex;justify-content:space-between;color:#8999b8;font-size:11px;margin-top:7px}.tapbox{text-align:center;padding:22px}.tap{width:215px;height:215px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#dcffa8,#8cff3e 50%,#42aa12);font-size:28px;font-weight:900;box-shadow:0 0 60px #8cff3e44;cursor:pointer;transition:.08s}.tap:active{transform:scale(.92)}.hint{color:#7788a8;font-size:11px;margin-top:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}.stat{background:#0b1220;border:1px solid #202e49;border-radius:16px;padding:13px}.stat b{display:block;font-size:21px}.stat small{color:#8292b0}.section{padding:16px}.title{font-weight:900;margin-bottom:12px}.up{display:flex;align-items:center;gap:10px;background:#0b1322;border:1px solid #263653;border-radius:16px;padding:12px;margin:9px 0}.ico{font-size:22px}.up main{flex:1}.up small{color:#7182a2}.buy{border:0;background:#8cff3e;color:#071006;border-radius:10px;padding:9px;font-weight:900}.buy:disabled{opacity:.35}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#080d18ee;backdrop-filter:blur(15px);border-top:1px solid #26334c;padding:9px}.nav button{background:none;border:0;color:#8190ad;padding:8px}.nav .on{color:#baff83;background:#142139;border-radius:12px}.panel{display:none}.panel.on{display:block}.row{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #202b42}.row main{flex:1}.pill{background:#17243a;color:#aaff72;border-radius:9px;padding:6px;font-size:11px}.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);opacity:0;background:#eaffd4;color:#071006;padding:10px 15px;border-radius:12px;font-weight:900;transition:.2s;z-index:9}.toast.on{opacity:1;transform:translate(-50%,0)}.float{position:fixed;color:#aaff72;font-weight:900;pointer-events:none;animation:f .8s forwards}@keyframes f{to{opacity:0;transform:translateY(-90px) scale(1.2)}}
</style></head><body><div id="toast" class="toast"></div><div class="app">
<div class="head"><div class="logo">GG <i>RUSH</i></div><div id="status" class="status">● ПІДКЛЮЧЕННЯ</div></div>
<section id="home" class="panel on"><div class="card balance"><div class="small">БАЛАНС</div><div id="gg" class="gg">0.00 <span>GG</span></div><div class="bar"><i id="xp"></i></div><div class="lv"><span id="level">Рівень 1</span><span id="need">0/100</span></div></div>
<div class="card tapbox"><button id="tap" class="tap">TAP<br>GG</button><div class="hint">Розвиток спеціально повільний — апгрейди дорожчають.</div></div>
<div class="card stats"><div class="stat"><b id="taps">0</b><small>ТАПІВ</small></div><div class="stat"><b id="cases">0</b><small>КЕЙСІВ</small></div><div class="stat"><b id="refs">0</b><small>РЕФЕРАЛІВ</small></div><div class="stat"><b id="multi">x1.00</b><small>МНОЖНИК</small></div></div>
<div class="card section"><div class="title">⚡ АПГРЕЙДИ</div><div id="ups"></div></div></section>
<section id="cases" class="panel"><div class="card section"><div class="title">🎁 КЕЙС</div><p style="color:#8292b0;font-size:12px">Кейс коштує 1 GG. Великі нагороди рідкісні.</p><button id="case" class="buy" style="width:100%;padding:14px">ВІДКРИТИ — 1.00 GG</button><div id="result" style="text-align:center;font-size:24px;font-weight:900;margin:20px"></div></div></section>
<section id="top" class="panel"><div class="card section"><div class="title">🏆 ТОП</div><div id="list">Завантаження...</div></div></section></div>
<nav class="nav"><button class="on" data-p="home">⚡<br>ГОЛОВНА</button><button data-p="cases">🎁<br>КЕЙС</button><button data-p="top">🏆<br>ТОП</button></nav>
<script>
const API="https://gg-rush-api.molikcotik.workers.dev",tg=window.Telegram?.WebApp,user=tg?.initDataUnsafe?.user||{id:"demo",username:"Гравець"},id=String(user.id);
let s=JSON.parse(localStorage.ggRush||'{"gg":0,"taps":0,"cases":0,"refs":0,"up":{}}');
const $=x=>document.getElementById(x);function save(){localStorage.ggRush=JSON.stringify(s)}function lv(){return Math.floor(s.taps/100)+1}function mul(){return 1+(s.up.multi||0)*.25}
function toast(x){$("toast").textContent=x;$("toast").classList.add("on");setTimeout(()=>$("toast").classList.remove("on"),1000)}
function render(){let l=lv(),n=s.taps%100;$("gg").innerHTML=s.gg.toFixed(2)+' <span>GG</span>';$("taps").textContent=s.taps;$("cases").textContent=s.cases;$("refs").textContent=s.refs;$("multi").textContent="x"+mul().toFixed(2);$("level").textContent="Рівень "+l;$("need").textContent=n+"/100";$("xp").style.width=n+"%";
let a=[["power","👆","СИЛА ТАПУ","Більше GG",.03],["multi","🔥","МНОЖНИК","Збільшує нагороду",.15],["crit","💎","КРИТ","Шанс x5",.25]];$("ups").innerHTML=a.map(x=>{let n=s.up[x[0]]||0,c=(x[4]*2**n*(1+(l-1)*.35)).toFixed(2);return `<div class="up"><div class="ico">${x[1]}</div><main><b>${x[2]} · ${n}</b><br><small>${x[3]}</small></main><button class="buy" onclick="buy('${x[0]}',${c})">${c} GG</button></div>`}).join("")}
async function post(p,d){try{return await(await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})).json()}catch(e){return null}}
$("tap").onclick=async e=>{let r=.01*(1+(s.up.power||0)*.5)*mul();if(Math.random()<(s.up.crit||0)*.035){r*=5;toast("💎 КРИТ x5!")}s.gg+=r;s.taps++;save();render();let f=document.createElement("div");f.className="float";f.textContent="+"+r.toFixed(2)+" GG";f.style.left=e.clientX+"px";f.style.top=e.clientY+"px";document.body.append(f);setTimeout(()=>f.remove(),800);await post("/player/tap",{telegramId:id})};
window.buy=(k,c)=>{if(s.gg<c)return toast("❌ Не вистачає GG");s.gg-=c;s.up[k]=(s.up[k]||0)+1;save();render();toast("⚡ АПГРЕЙД!")}
$("case").onclick=async()=>{if(s.gg<1)return toast("❌ Потрібно 1 GG");s.gg--;s.cases++;let r=Math.random(),w=r<.01?10:r<.08?3:r<.28?1:.1;s.gg+=w;save();render();$("result").textContent="🎁 +"+w.toFixed(2)+" GG";await post("/player/case",{telegramId:id})};
async function heartbeat(){let r=await post("/player/heartbeat",{telegramId:id,username:user.username||"Гравець"});$("status").textContent=r?.ok?"● ОНЛАЙН":"● OFFLINE"}
async function top(){try{let a=await(await fetch(API+"/top")).json();$("list").innerHTML=a.map((p,i)=>`<div class="row"><b>#${i+1}</b><main><b>${p.username||"Гравець"}</b><br><small>${p.taps||0} тапів</small></main><span class="pill">${Number(p.gg||0).toFixed(2)} GG</span></div>`).join("")}catch(e){$("list").textContent="Помилка завантаження"}}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));$(b.dataset.p).classList.add("on");if(b.dataset.p=="top")top()});
render();heartbeat();setInterval(heartbeat,60000);
</script></body></html>
