<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAR MY CAR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a0f;color:white;font-family:Arial}.app{max-width:520px;margin:auto;padding:16px 14px 90px;background:radial-gradient(circle at 50% 0,#253448,#070a0f 55%);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900}.logo span{color:#ffd32e}.money{background:#121b28;border:1px solid #304058;padding:9px 12px;border-radius:13px;color:#ffd32e;font-weight:900}
.card{margin-top:13px;background:#0d141f;border:1px solid #29384d;border-radius:22px;padding:16px}.carcard{text-align:center}.rarity{font-size:9px;letter-spacing:2px;color:#93a2b7}.name{font-size:25px;font-weight:900;margin:5px}.car{font-size:120px;height:190px;display:grid;place-items:center;cursor:pointer;user-select:none;filter:drop-shadow(0 20px 20px #000)}.car:active{transform:scale(.9)}.bar{height:12px;background:#202c3d;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#ffd32e;width:0;box-shadow:0 0 15px #ffd32e}.fuel{display:flex;justify-content:space-between;color:#8795a8;font-size:10px;margin:6px 0}.refuel,.buy,.spin{border:0;border-radius:10px;padding:10px;font-weight:900;cursor:pointer}.refuel{width:100%;margin-top:10px;background:#ffd32e}.refuel:disabled{opacity:.3}.slots{padding:15px}.title{font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.slot{background:#0a111a;border:1px solid #2a3a51;border-radius:16px;padding:11px;min-height:125px}.slot.active{border-color:#ffd32e}.mini{font-size:40px;margin:7px 0}.slot small{color:#748399}.buy{background:#ffd32e}.spin{background:#5de1ff}.modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:20px;z-index:5}.modal.show{display:grid}.box{width:100%;max-width:400px;background:#101a27;border:1px solid #3b4d67;border-radius:24px;padding:25px;text-align:center}.roll{font-size:90px;height:120px;display:grid;place-items:center}.rolling{animation:r .7s}.reward{font-size:24px;font-weight:900}@keyframes r{50%{transform:scale(1.3) rotate(8deg);filter:brightness(1.5)}}.float{position:fixed;color:#ffe25b;font-size:20px;font-weight:900;pointer-events:none;animation:f .7s forwards;z-index:9}@keyframes f{to{opacity:0;transform:translateY(-90px)}}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#080d14ee;display:grid;grid-template-columns:repeat(2,1fr);padding:10px;z-index:4}.nav button{background:transparent;border:0;color:#9aa8bb;padding:10px;font-weight:900}
</style><body><main class="app"><header><div class="logo">CAR <span>MY CAR</span></div><div class="money">🪙 <b id="money">1000</b></div></header>
<div id="garage"><section class="card carcard"><div class="rarity" id="rarity">COMMON</div><div class="name" id="name">ЖИГУЛЬ</div><div class="car" id="car">🚗</div><div class="fuel"><span>ПАЛИВО</span><b id="pct">0%</b></div><div class="bar"><i id="bar"></i></div><button class="refuel" id="refuel" disabled>⛽ ЗАПРАВИТИ</button><div id="timer" style="color:#ffd32e;font-size:10px;margin-top:7px"></div></section>
<section class="card slots"><div class="title">🚘 СЛОТИ <small style="color:#77869b">Кожен купується окремо</small></div><div class="grid" id="slots"></div></section></div>
<div id="shop" style="display:none"><section class="card"><div class="title">🎰 МАГАЗИН СЛОТІВ</div><p style="color:#8290a3;font-size:12px">Купуєш слот → отримуєш випадкову машину.</p><div id="shopSlots"></div></section></div></main>
<div class="modal" id="modal"><div class="box"><small>РАНДОМНА МАШИНА</small><div class="roll" id="roll">🎁</div><div class="reward" id="reward">?</div><button class="buy" id="open">ВІДКРИТИ</button><button class="spin" id="close">ЗАКРИТИ</button></div></div>
<nav class="nav"><button onclick="page('garage')">🚗 ГАРАЖ</button><button onclick="page('shop')">🎰 СЛОТИ</button></nav>
<script>
const cars=[
["ЖИГУЛЬ","🚗","COMMON",55,0,100],["LADA","🚙","UNCOMMON",25,1200,180],["BMW","🚘","RARE",12,7500,320],["PORSCHE","🏎️","EPIC",6,30000,600],["LAMBORGHINI","🏁","LEGENDARY",2,150000,1200]];
const prices=[0,1000,7500,50000,350000];
let s=JSON.parse(localStorage.carMyCar||"null")||{money:1000,active:0,taps:0,slots:[{owned:1,car:0,fuel:0,end:0},{owned:0},{owned:0},{owned:0},{owned:0}]};
const $=id=>document.getElementById(id); function save(){localStorage.carMyCar=JSON.stringify(s)}
function rand(){let n=Math.random()*100,a=0;for(let i=0;i<cars.length;i++){a+=cars[i][3];if(n<a)return i}return 0}
function render(){let x=s.slots[s.active],c=cars[x.car||0],busy=x.end>Date.now();$("money").textContent=Math.floor(s.money).toLocaleString();$("name").textContent=c[0];$("rarity").textContent=c[2];$("car").textContent=c[1];$("pct").textContent=x.fuel+"%";$("bar").style.width=x.fuel+"%";$("refuel").disabled=x.fuel<100||busy;$("refuel").textContent=busy?"⏳ ЗАПРАВКА":"⛽ ЗАПРАВИТИ";$("timer").textContent=busy?"Залишилось: "+time(x.end-Date.now()):"";drawSlots();save()}
function time(ms){let z=Math.max(0,Math.floor(ms/1000)),h=Math.floor(z/3600),m=Math.floor(z%3600/60),q=z%60;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(q).padStart(2,"0")}
function drawSlots(){let a="";s.slots.forEach((x,i)=>{if(!x.owned)a+=`<div class="slot"><small>СЛОТ ${i+1}</small><div class="mini">🔒</div><b>${prices[i].toLocaleString()} 🪙</b><br><button class="buy" onclick="buySlot(${i})">КУПИТИ</button></div>`;else{let c=cars[x.car||0];a+=`<div class="slot ${i==s.active?"active":""}" onclick="select(${i})"><small>СЛОТ ${i+1}</small><div class="mini">${c[1]}</div><b>${c[0]}</b><br><small>${c[2]} • ${x.fuel}%</small><br><button class="spin" onclick="event.stopPropagation();randomize(${i})">🎰 РАНДОМ</button></div>`}});$("slots").innerHTML=a}
function shop(){let a="";s.slots.forEach((x,i)=>a+=`<div class="slot" style="margin-top:9px">Слот ${i+1} — ${x.owned?"✅ "+cars[x.car||0][0]:prices[i].toLocaleString()+" 🪙"} ${!x.owned?`<button class="buy" onclick="buySlot(${i})">КУПИТИ</button>`:""}</div>`);$("shopSlots").innerHTML=a}
window.select=i=>{s.active=i;render()};window.buySlot=i=>{if(s.money<prices[i])return alert("Не вистачає монет");s.money-=prices[i];s.slots[i]={owned:1,car:rand(),fuel:0,end:0};s.active=i;openModal(i);render()};window.randomize=i=>{s.active=i;openModal(i)}
function openModal(i){$("modal").classList.add("show");$("reward").textContent="?";$("roll").textContent="🎁";$("open").onclick=()=>{let c=rand();s.slots[i].car=c;$("roll").textContent=cars[c][1];$("roll").classList.add("rolling");setTimeout(()=>{$("reward").textContent=cars[c][0]+" • "+cars[c][2];$("roll").classList.remove("rolling");render()},700);$("open").disabled=true;setTimeout(()=>$("open").disabled=false,750)}}
$("close").onclick=()=>{$("modal").classList.remove("show")};
$("car").onclick=e=>{let x=s.slots[s.active];if(x.end>Date.now())return;if(x.fuel>=100)return alert("⛽ Машину треба заправити");let c=cars[x.car||0];x.fuel=Math.min(100,x.fuel+100/c[5]);s.taps++;let f=document.createElement("div");f.className="float";f.textContent="+1 TAP";f.style.left=e.clientX+"px";f.style.top=e.clientY+"px";document.body.append(f);setTimeout(()=>f.remove(),700);render()};
$("refuel").onclick=()=>{let x=s.slots[s.active];if(x.fuel>=100)x.end=Date.now()+12*60*60*1000;render()};
function page(p){$("garage").style.display=p=="garage"?"block":"none";$("shop").style.display=p=="shop"?"block":"none";if(p=="shop")shop()}setInterval(()=>render(),1000);render();
</script></body></html>
