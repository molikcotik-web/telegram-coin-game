<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<style>
body{margin:0;background:#070b09;color:#fff;font-family:Arial}
.bg:before,.bg:after{content:'';position:fixed;border-radius:50%;filter:blur(80px);z-index:-1}
.bg:before{width:260px;height:260px;background:#00ff8866;top:-60px;left:-60px}
.bg:after{width:300px;height:300px;background:#5cff0066;bottom:-100px;right:-100px}
.top{padding:20px}.card{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:18px}
.gg{font-size:34px;font-weight:bold}
.car{display:flex;flex-direction:column;align-items:center;margin:20px}
.car img{width:78%;max-width:420px;transition:.15s}
.car img:active{transform:scale(.95) rotate(-2deg)}
.placeholder{width:78%;max-width:420px;height:220px;border-radius:24px;border:2px dashed #33ff99;display:flex;align-items:center;justify-content:center;font-size:64px;color:#33ff99}
.bar{height:14px;background:#1a1a1a;border-radius:20px;overflow:hidden;width:86%}.fill{width:64%;height:100%;background:linear-gradient(90deg,#22ff88,#9dff00)}
.bottom{position:fixed;bottom:14px;left:14px;right:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btn{background:rgba(255,255,255,.08);border-radius:20px;padding:12px;text-align:center}
</style></head><body><div class='bg'></div><div class='top'><div class='card'><div>GG</div><div class='gg'>12 458.42</div></div></div>
<div class='car'><h2>ВАЗ-2107</h2><div class='placeholder'>🚗</div><div class='bar'><div class='fill'></div></div><p>Торкнись машини</p></div>
<div class='bottom'><div class='btn'>🚗<br>Garage</div><div class='btn'>🎰<br>Slots</div><div class='btn'>🎯<br>Quests</div><div class='btn'>👤<br>Profile</div></div></body></html>
