<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COIN RUSH ULTRA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#10152b,#252b55);color:#fff;min-height:100vh;display:flex;justify-content:center}
.app{width:min(520px,100%);padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{margin:0;font-size:27px}.panel{background:#171b2b;border:1px solid #3b4265;border-radius:22px;padding:18px;box-shadow:0 15px 40px #0008;margin-bottom:14px}
.balances{display:grid;grid-template-columns:1fr 1fr;gap:10px}.balance{background:#242a45;border-radius:15px;padding:13px;text-align:center}.num{font-size:24px;font-weight:800;margin-top:4px}
.coin{width:190px;height:190px;border:0;border-radius:50%;margin:20px auto;display:block;background:radial-gradient(circle at 35% 30%,#fff59d 0,#ffd21c 35%,#e49c00 72%,#8f5c00);font-size:65px;cursor:pointer;box-shadow:0 12px 35px #0008;transition:.08s}.coin:active{transform:scale(.91)}
button{font:inherit;font-weight:700;border:0;border-radius:13px;padding:12px 15px;background:#5d72ff;color:#fff;cursor:pointer}.row{display:flex;gap:9px;flex-wrap:wrap}.small{font-size:13px;color:#aeb5d7}.case{border:2px solid #8b5cff;background:linear-gradient(145deg,#292052,#171b2b);text-align:center}.casebox{font-size:70px;margin:8px}.case button{width:100%}.disabled{opacity:.45;cursor:not-allowed}.reward{font-size:20px;font-weight:800;color:#ffd84d;min-height:28px;margin:8px}
.token{display:inline-flex;align-items:center;gap:7px;background:#242a45;border-radius:12px;padding:9px 12px;cursor:pointer;user-select:none}.gg{color:#7dff9b;font-weight:900}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#111827;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>🪙 COIN RUSH</h1><div class="token" id="ggTap" title="Натисни!">🟢 <span class="gg">GG</span> <b id="gg">0</b></div></div>

  <div class="panel">
    <div class="balances">
      <div class="balance">🪙 Coins<div class="num" id="coins">0</div></div>
      <div class="balance">⚡ Power<div class="num" id="power">1</div></div>
    </div>
    <button class="coin" id="coin">🪙</button>
    <div class="small" style="text-align:center">Тапай по монеті! Кожен тап дає Coins.</div>
  </div>

  <div class="panel case">
    <h2>🎁 Безкоштовний кейс</h2>
    <div class="casebox">📦</div>
    <div id="caseStatus" class="small">Кейс можна відкрити 1 раз на день.</div>
    <div class="reward" id="reward"></div>
    <button id="openCase">ВІДКРИТИ БЕЗКОШТОВНО</button>
  </div>

  <div class="panel">
    <h2>⚡ Покращення</h2>
    <div class="row">
      <button id="upgrade">+1 Power — <span id="price">50</span> 🪙</button>
      <button id="ggBonus">+1 GG — 100 🪙</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY="coinrush_case_v2";
let s=JSON.parse(localStorage.getItem(KEY)||'null')||{coins:0,power:1,gg:0,lastCase:""};
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}
function today(){return new Date().toISOString().slice(0,10)}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1500)}
function render(){
 $("coins").textContent=Math.floor(s.coins).toLocaleString();
 $("power").textContent=s.power;
 $("gg").textContent=s.gg;
 $("price").textContent=50*s.power;
 const used=s.lastCase===today();
 $("openCase").disabled=used;$("openCase").classList.toggle("disabled",used);
 $("caseStatus").textContent=used?"⏰ Сьогодні кейс уже відкрито. Повертайся завтра!":"🎁 Сьогоднішній кейс готовий!";
}
$("coin").onclick=()=>{s.coins+=s.power;save()}
$("ggTap").onclick=()=>{s.gg++;toast("🟢 +1 GG!");save()}
$("upgrade").onclick=()=>{
 const p=50*s.power;
 if(s.coins<p)return toast("❌ Не вистачає Coins");
 s.coins-=p;s.power++;toast("⚡ Power покращено!");save()
}
$("ggBonus").onclick=()=>{
 if(s.coins<100)return toast("❌ Не вистачає Coins");
 s.coins-=100;s.gg++;toast("🟢 +1 GG!");save()
}
$("openCase").onclick=()=>{
 if(s.lastCase===today())return;
 s.lastCase=today();
 const rewards=[100,250,500,1000,2500,5000];
 const r=rewards[Math.floor(Math.random()*rewards.length)];
 s.coins+=r;
 $("reward").textContent=`🎉 Ти отримав +${r.toLocaleString()} Coins!`;
 toast("📦 Кейс відкрито!");
 save();
}
render();
</script>
</body>
</html>
